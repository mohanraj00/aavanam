name: Claude review
# A PR author asks for a review in a PR comment that contains @claude. The action checks that the commenter can write to this repo.
# The PR text and diff are untrusted input. Claude gets read-only tools with no token, and the action posts its comments.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The PR text and diff can hold a prompt injection. Remove credentials from the environment of each tool subprocess.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      # Start with the default branch files. The action later checks out the PR branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # Fetch a fixed PR head ref for the diff. The action restores only its fixed list of configuration paths from the default branch.
      # That list includes instruction and settings files. It does not include tools/.
      - name: Fetch the PR commits
        env:
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
      # The action turns on PID isolation only for non-write users, so install bubblewrap here. Then a tool cannot read the Claude process environment.
      - name: Install subprocess isolation
        run: bash tools/prepare_claude_review.sh
      # Keep the default branch validator before the action changes the working tree.
      - name: Keep the review validator
        run: cp tools/check_claude_review.py "$RUNNER_TEMP/check_claude_review.py"
      - uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowed-tools "Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
            --disallowed-tools "Read(//proc/**),Grep(//proc/**),Glob(//proc/**)"
            --append-system-prompt "The PR head is at refs/remotes/pr/head. First run exactly git diff origin/main...pr/head as one Bash call. Do not add flags, pipes or other commands to that call. If a shell call fails, start your comment with NO VALID CLAUDE REVIEW and do not give a clean verdict. Otherwise start your comment with Claude review is provisional until the workflow passes. Post the review with your comment tool and inline comments."
      # The action can report success after a tool error. Check the tool results independently.
      - name: Validate the Claude review
        if: ${{ always() }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
        run: |
          if ! head=$(git rev-parse pr/head); then
            echo 'NO VALID CLAUDE REVIEW' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Reviewed PR head: %s\n' "$head" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! python3 -I -B "$RUNNER_TEMP/check_claude_review.py" "$EXECUTION_FILE" --conclusion "$CONCLUSION"; then
            echo 'NO VALID CLAUDE REVIEW' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

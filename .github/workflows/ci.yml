name: CI
# The ci-ok skeleton. Copy this file to .github/workflows/ci.yml of the project, then put the project jobs in it.
# Replace the SHA of the gates action with a full SHA of mohanraj00/.github on main.
# A docs-only PR skips the project jobs, and ci-ok still passes. The check job always runs.
# Do not use paths-ignore, because a required check can then stay pending.
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The classify step reads .github/gates.json from the base branch, so a PR cannot mark its own change as docs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: classify
        uses: mohanraj00/.github/gates@b5d2b63f9bc6a61a17b1370d8e23cbee37008076 # mohanraj00/.github at b5d2b63
        with:
          check: classify
  # The project check always runs. A contract change can break a vector citation, so the spec checks also run here.
  shared-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.6
      - name: Validate the shared harness layout and the source inventory
        run: python3 -B tools/check_project.py
      - name: Check the spec, the clauses, the registry tables, the vectors and the fixtures
        run: python3 -B tools/check_spec.py
      - name: Test the conformance runner
        run: python3 -B -m unittest discover -s conformance
  # The gate regression cases (an unaccepted fork, a record for an old head or base, an incomplete file list, a review
  # of another commit) are tests of the pinned gates action. Run them at the same SHA as the gates in each change.
  # tools/check_project.py requires one SHA for each use of mohanraj00/.github.
  shared-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mohanraj00/.github
          ref: b5d2b63f9bc6a61a17b1370d8e23cbee37008076
          persist-credentials: false
      - name: Run the gate regression tests of the pinned gates action
        run: python3 -B -I -m unittest discover -s tests -p test_gate.py
  # The project suite runs only for a change that is not docs-only.
  suite:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.6
      - name: Record the toolchain
        run: |
          uname -srm
          if [ -r /etc/os-release ]; then grep PRETTY_NAME /etc/os-release; else sw_vers; fi
          python3 --version
          python3 -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
      - name: Test the reference implementation
        run: python3 -B -m unittest discover -s tests
      # The tests above run with the standard library only, so the seam tests skip there. Then install the pinned
      # producer, and require the seam tests to run (PRD-PRO-1, ADP-FACT-1).
      - name: Install the pinned groundgate of the seam tests
        run: |
          python3 -m pip install --require-hashes --only-binary :all: --no-deps -r tests/requirements-seam.txt
      - name: Run the seam tests against the pinned groundgate
        env:
          AAVANAM_SEAM: "1"
        run: python3 -B -m unittest discover -s tests -p test_groundgate_seam.py
      - name: Run all vectors against the reference implementation
        run: python3 -B conformance/runner.py --adapter store_adapter:StoreAdapter
      # The null implementation refuses each call. If it passes all vectors, a refusal vector has no positive pair.
      - name: Require the null implementation to fail
        run: |
          set +e
          python3 -B conformance/runner.py --adapter null_adapter:NullAdapter > null.txt 2>&1
          status=$?
          tail -n 5 null.txt
          if [ "$status" -ne 1 ]; then echo "::error::The null implementation must fail with exit 1, not $status."; exit 1; fi
  # Build the wheel and the source archive from a clean copy of the commit, then run the examples from the wheel.
  # The job always runs, because examples/ and README.md are not in the code paths of the gates.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.6
      - name: Make a clean copy of the commit
        run: |
          mkdir "$RUNNER_TEMP/clean"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/clean"
      - name: Install the pinned build tools in a clean environment
        run: |
          python3 -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/python" -m pip install --require-hashes --only-binary :all: --no-deps \
            -r .github/requirements-build.txt
      - name: Build the wheel and the source archive
        run: |
          "$RUNNER_TEMP/build-env/bin/python" -m build --no-isolation --outdir "$RUNNER_TEMP/dist" "$RUNNER_TEMP/clean"
          ls -l "$RUNNER_TEMP/dist"
          test "$(ls "$RUNNER_TEMP"/dist/*.whl | wc -l)" -eq 1
          test "$(ls "$RUNNER_TEMP"/dist/*.tar.gz | wc -l)" -eq 1
      - name: Install only the wheel in a second clean environment
        run: |
          python3 -m venv "$RUNNER_TEMP/user-env"
          "$RUNNER_TEMP/user-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Run the examples from the installed wheel
        env:
          AAVANAM_INSTALLED: "1"
        working-directory: ${{ runner.temp }}/clean
        run: |
          set -o pipefail
          "$RUNNER_TEMP/user-env/bin/python" -B -m unittest discover -s tests -p test_examples.py -v 2>&1 | tee examples.txt
          if grep -q skipped examples.txt; then echo "::error::A test of the examples skipped."; exit 1; fi
      # The PDF example (examples/pdf_facts/) needs groundgate. Install its pinned wheels in the environment of the
      # aavanam wheel, and require its test to run (issue #71).
      - name: Install the pinned groundgate of the PDF example
        run: |
          "$RUNNER_TEMP/user-env/bin/python" -m pip install --require-hashes --only-binary :all: --no-deps \
            -r examples/pdf_facts/requirements.txt
      - name: Run the PDF example from the installed wheel
        env:
          AAVANAM_INSTALLED: "1"
          AAVANAM_PDF_EXAMPLE: "1"
        working-directory: ${{ runner.temp }}/clean
        run: |
          set -o pipefail
          "$RUNNER_TEMP/user-env/bin/python" -B -m unittest discover -s tests -p test_pdf_example.py -v 2>&1 | tee pdf.txt
          if grep -q skipped pdf.txt; then echo "::error::A test of the PDF example skipped."; exit 1; fi
  # The required check. Add each project job to needs. A skipped job passes. A failed or cancelled job fails.
  ci-ok:
    needs: [changes, shared-project, shared-gates, suite, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Collect the project jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -B -I -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = sorted(k for k, v in needs.items() if v["result"] not in ("success", "skipped"))
          if needs.get("changes", {}).get("result") != "success":
              bad = sorted(set(bad) | {"changes"})
          print("\n".join("%s: %s" % (k, v["result"]) for k, v in sorted(needs.items())))
          sys.exit("Failed jobs: " + ", ".join(bad) if bad else 0)
          '
